name: CI

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: extractions/setup-just@v2
        with:
          just-version: 1.58.0
      - name: Make apt fail fast
        timeout-minutes: 1
        run: |
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "15";' \
            'Acquire::https::Timeout "15";' | sudo tee /etc/apt/apt.conf.d/80-fail-fast
      - name: Install web deps
        timeout-minutes: 3
        run: pnpm -C web install --frozen-lockfile
      - name: Check
        timeout-minutes: 5
        run: just check
      - name: Test
        timeout-minutes: 5
        run: just test
      - name: Install Playwright chromium
        timeout-minutes: 5
        run: pnpm -C web exec playwright install --with-deps chromium
      - name: Web tests
        timeout-minutes: 5
        run: just webtest

  itest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        calibre: ["9.0.0", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: extractions/setup-just@v2
        with:
          just-version: 1.58.0
      - name: Make apt fail fast
        timeout-minutes: 1
        run: |
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "15";' \
            'Acquire::https::Timeout "15";' | sudo tee /etc/apt/apt.conf.d/80-fail-fast
      - name: Install calibre headless libraries
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libopengl0 libxcb-cursor0 libxkbcommon0 libxkbcommon-x11-0 \
            libgl1 libdbus-1-3 libfontconfig1 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libxrender1 libxi6
      - name: Install calibre (non-root, isolated)
        timeout-minutes: 5
        run: |
          if [ "${{ matrix.calibre }}" = "latest" ]; then
            wget -nv -O- https://download.calibre-ebook.com/linux-installer.sh \
              | sh /dev/stdin install_dir=$HOME/calibre-bin isolated=y
          else
            wget -nv -O- https://download.calibre-ebook.com/linux-installer.sh \
              | sh /dev/stdin install_dir=$HOME/calibre-bin isolated=y version=${{ matrix.calibre }}
          fi
      - name: Report calibre's Python
        timeout-minutes: 1
        run: $HOME/calibre-bin/calibre/calibre-debug -c "import sys; print(sys.version)"
      - name: Install Playwright chromium
        timeout-minutes: 5
        run: |
          pnpm -C web install --frozen-lockfile
          pnpm -C web exec playwright install --with-deps chromium
      - name: Integration smoke test
        timeout-minutes: 10
        env:
          PERF_REPORT_ONLY: ${{ matrix.calibre != 'latest' && '1' || '0' }}
        run: CALIBRE_BIN_DIR=$HOME/calibre-bin/calibre just itest
