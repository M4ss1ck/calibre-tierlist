[project]
name = "tierlist"
version = "0.4.1"
description = "Calibre Tier List plugin (development only; ships zero runtime dependencies)"
license = "GPL-3.0-only"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "pyright>=1.1",
    "jsonschema>=4.26.0",
]

[tool.uv]
package = false

[tool.ruff]
# calibre 9.0.0 ships CPython 3.14.2; see docs/adr/0006-calibre-python-version.md
target-version = "py314"
line-length = 120
# calibre injects `_`, `ngettext` into builtins and `load_translations`, `get_icons` into plugin modules.
builtins = ["_", "ngettext", "load_translations", "get_icons"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]

[tool.pyright]
typeCheckingMode = "strict"
stubPath = "typings"
extraPaths = ["src", "tools"]
include = ["src", "tools", "tests", "itest", "calibre_entry.py"]
# calibre only ships compiled modules, so our stubs have no source to point at.
reportMissingModuleSource = "none"
